<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Sophie — 9amHealth</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/react/18.2.0/umd/react.development.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.2.0/umd/react-dom.development.js"></script>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{background:#FFFCF3;font-family:system-ui,sans-serif}
@keyframes bounce{0%,80%,100%{transform:translateY(0)}40%{transform:translateY(-5px)}}
@keyframes fadeIn{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:translateY(0)}}
.msg-in{animation:fadeIn 0.25s ease forwards}
textarea{font-family:system-ui,sans-serif}
textarea:focus{outline:none;border-color:#80AEFF !important}
button{font-family:system-ui,sans-serif;cursor:pointer}
button.opt:hover{background:#F2EFE7 !important}
button.cta:hover{opacity:0.88}
</style>
</head>
<body>
<div id="root"></div>
<script>
const e = React.createElement;
const {useState, useRef, useEffect} = React;

const C = {
  cream:"#FFFCF3", darkCream:"#F2EFE7", lightGray:"#E6E3DB",
  gray:"#AAA7A0", charcoal:"#212121", charcoal80:"#4D4D4D",
  sunriseBlue:"#80AEFF", sunrisePink:"#F7BDE6", sunriseOrange:"#FFBD70",
  midMorningBlue:"#ABD4FF", midMorningPink:"#FBDEF3",
  afternoonGreen:"#B0F2CE", fog:"#F4F4F4"
};

const SophieAvatar = () => e('div',{style:{width:34,height:34,borderRadius:'50%',background:'linear-gradient(135deg,#F7BDE6,#80AEFF)',display:'flex',alignItems:'center',justifyContent:'center',flexShrink:0}},
  e('span',{style:{color:C.charcoal,fontSize:12,fontWeight:600}},'S'));

const UserAvatar = () => e('div',{style:{width:34,height:34,borderRadius:'50%',background:C.midMorningBlue,display:'flex',alignItems:'center',justifyContent:'center',flexShrink:0}},
  e('span',{style:{color:C.charcoal,fontSize:12,fontWeight:600}},'A'));

const TypingIndicator = () => e('div',{style:{display:'flex',gap:4,alignItems:'center',padding:'10px 14px'}},
  [0,1,2].map(i=>e('div',{key:i,style:{width:6,height:6,borderRadius:'50%',background:C.gray,animation:`bounce 1.2s ease-in-out ${i*0.2}s infinite`}})));

const NavBar = ({active, onNav}) => {
  const tabs = [
    {id:'home',label:'Home',path:'M3 9.5L12 3l9 6.5V20a1 1 0 01-1 1H4a1 1 0 01-1-1V9.5z'},
    {id:'chat',label:'Chat',path:'M21 15a2 2 0 01-2 2H7l-4 4V5a2 2 0 012-2h14a2 2 0 012 2z'},
    {id:'meals',label:'Meals',path:'M18 8h1a4 4 0 010 8h-1 M2 8h16v9a4 4 0 01-4 4H6a4 4 0 01-4-4V8z'},
    {id:'charts',label:'Charts',path:'M18 20v-10 M12 20v-16 M6 20v-6'},
  ];
  return e('div',{style:{position:'fixed',bottom:0,left:'50%',transform:'translateX(-50%)',width:'100%',maxWidth:420,background:C.cream,borderTop:`1px solid ${C.lightGray}`,display:'flex',justifyContent:'space-around',padding:'10px 0 18px',zIndex:100}},
    tabs.map(({id,label,path})=>{
      const a=active===id;
      return e('div',{key:id,onClick:()=>onNav(id),style:{display:'flex',flexDirection:'column',alignItems:'center',gap:3,cursor:'pointer',padding:'0 12px'}},
        e('svg',{width:20,height:20,viewBox:'0 0 24 24',fill:'none',stroke:a?C.charcoal:C.gray,strokeWidth:2,strokeLinecap:'round',strokeLinejoin:'round'},
          e('path',{d:path})),
        e('span',{style:{fontSize:10,fontWeight:a?600:400,color:a?C.charcoal:C.gray}},label));
    }));
};

const WoopCard = ({wish,outcome,obstacle,plan,updated}) => {
  const rows = [
    {step:'W',label:'Wish',content:wish,color:C.sunriseBlue},
    {step:'O',label:'Outcome',content:outcome,color:C.afternoonGreen},
    {step:'O',label:'Obstacle',content:updated?'Low energy after work AND the unpredictability of my schedule':obstacle,color:C.sunriseOrange},
    {step:'P',label:'Plan',content:updated?plan+'\n\nBackup: If my evening gets derailed, I\'ll do a 10-minute walk at lunch instead -- that counts.':plan,color:C.sunrisePink},
  ];
  const nudges = updated?[
    {time:'12:00 PM',msg:"Backup move: got 10 minutes? A walk at lunch counts toward your goal."},
    {time:'5:30 PM',msg:"Heading home? Even a 15-min walk before you sit down makes a difference."},
    {time:'8:00 PM',msg:"Quick check: did you move today? Tap to log it."},
  ]:[
    {time:'5:30 PM',msg:"End of workday nudge: a 20-min walk before dinner is your plan for tonight."},
    {time:'7:00 PM',msg:"Reminder: movement doesn't have to be a workout. A walk counts."},
    {time:'8:30 PM',msg:"Quick check: did you move today? Tap to log it."},
  ];
  return e('div',{style:{background:C.cream,border:`1px solid ${updated?C.afternoonGreen:C.lightGray}`,borderRadius:16,padding:'14px 16px',marginTop:10}},
    e('div',{style:{display:'flex',justifyContent:'space-between',alignItems:'center',marginBottom:12}},
      e('span',{style:{fontSize:11,fontWeight:600,color:C.gray,letterSpacing:'0.06em',textTransform:'uppercase'}},'Your plan'),
      updated&&e('span',{style:{fontSize:11,background:C.afternoonGreen,color:C.charcoal,borderRadius:20,padding:'2px 10px',fontWeight:600}},'Updated')),
    rows.map(({step,label,content,color})=>
      e('div',{key:label,style:{borderLeft:`3px solid ${color}`,paddingLeft:10,marginBottom:10}},
        e('div',{style:{fontSize:10,fontWeight:600,color:C.gray,marginBottom:2,letterSpacing:'0.05em'}},step+' -- '+label),
        e('div',{style:{fontSize:13,color:C.charcoal,lineHeight:1.55,whiteSpace:'pre-line'}},content))),
    e('div',{style:{borderTop:`1px solid ${C.lightGray}`,paddingTop:10,marginTop:4}},
      e('div',{style:{fontSize:11,fontWeight:600,color:C.gray,marginBottom:8,letterSpacing:'0.04em',textTransform:'uppercase'}},'Active nudges'),
      nudges.map((n,i)=>
        e('div',{key:i,style:{display:'flex',gap:10,marginBottom:6,alignItems:'flex-start'}},
          e('span',{style:{fontSize:12,color:C.charcoal80,fontWeight:600,minWidth:62,flexShrink:0}},n.time),
          e('span',{style:{fontSize:12,color:C.charcoal80,lineHeight:1.5}},n.msg)))));
};

const HomeScreen = ({data}) =>
  e('div',{style:{paddingBottom:'5rem'}},
    e('div',{style:{display:'flex',justifyContent:'space-between',alignItems:'center',marginBottom:20}},
      e('div',{style:{width:36,height:36,borderRadius:'50%',background:C.darkCream,display:'flex',alignItems:'center',justifyContent:'center'}},
        e('svg',{width:18,height:18,viewBox:'0 0 24 24',fill:'none',stroke:C.gray,strokeWidth:2},
          e('path',{d:'M20 21v-2a4 4 0 00-4-4H8a4 4 0 00-4 4v2'}),e('circle',{cx:12,cy:7,r:4}))),
      e('div',{style:{background:C.darkCream,borderRadius:20,padding:'6px 14px'}},
        e('span',{style:{fontSize:12,color:C.charcoal,fontWeight:500}},'0/4'))),
    e('div',{style:{marginBottom:14}},
      e('div',{style:{fontSize:11,fontWeight:600,color:C.gray,letterSpacing:'0.08em',textTransform:'uppercase',marginBottom:10}},'Your tasks'),
      e('div',{style:{background:'#fff',borderRadius:16,border:`1px solid ${C.lightGray}`,overflow:'hidden'}},
        [{label:'Start Your Journey',icon:'🎯'},{label:'Create Your First Meal Plan',icon:'🥗'}].map(({label,icon},i)=>
          e('div',{key:label,style:{display:'flex',alignItems:'center',justifyContent:'space-between',padding:'14px 16px',borderBottom:i===0?`1px solid ${C.lightGray}`:'none'}},
            e('div',{style:{display:'flex',alignItems:'center',gap:12}},
              e('div',{style:{width:36,height:36,borderRadius:10,background:C.darkCream,display:'flex',alignItems:'center',justifyContent:'center',fontSize:16}},icon),
              e('span',{style:{fontSize:14,color:C.charcoal,fontWeight:500}},label)),
            e('svg',{width:16,height:16,viewBox:'0 0 24 24',fill:'none',stroke:C.gray,strokeWidth:2},
              e('polyline',{points:'9 18 15 12 9 6'})))))),
    e('div',{style:{marginBottom:10}},
      e('div',{style:{fontSize:11,fontWeight:600,color:C.gray,letterSpacing:'0.08em',textTransform:'uppercase',marginBottom:10}},'Your plan'),
      e('div',{style:{background:'#fff',borderRadius:16,border:`1px solid ${C.afternoonGreen}`,padding:'16px',cursor:'pointer'}},
        e('div',{style:{display:'flex',justifyContent:'space-between',alignItems:'flex-start',marginBottom:12}},
          e('div',{style:{fontSize:14,fontWeight:600,color:C.charcoal,lineHeight:1.4,maxWidth:'75%'}},'Build a consistent exercise habit'),
          e('span',{style:{fontSize:11,background:C.afternoonGreen,color:C.charcoal,borderRadius:20,padding:'2px 10px',fontWeight:600,flexShrink:0}},'Active')),
        e('div',{style:{display:'flex',gap:6,marginBottom:14}},
          [{step:'W',color:C.sunriseBlue},{step:'O',color:C.sunriseOrange},{step:'P',color:C.sunrisePink}].map(({step,color})=>
            e('div',{key:step,style:{width:26,height:26,borderRadius:'50%',background:color,display:'flex',alignItems:'center',justifyContent:'center'}},
              e('span',{style:{fontSize:11,fontWeight:700,color:C.charcoal}},step))),
          e('span',{style:{fontSize:12,color:C.gray,alignSelf:'center',marginLeft:4}},'Updated today')),
        e('div',{style:{borderTop:`1px solid ${C.lightGray}`,paddingTop:10}},
          e('div',{style:{fontSize:11,fontWeight:600,color:C.gray,marginBottom:6,textTransform:'uppercase',letterSpacing:'0.04em'}},"Today's nudges"),
          e('div',{style:{display:'flex',gap:6,flexWrap:'wrap'}},
            ['12:00 PM','5:30 PM','8:00 PM'].map(t=>
              e('span',{key:t,style:{fontSize:11,background:C.fog,color:C.charcoal80,borderRadius:20,padding:'4px 10px',fontWeight:500}},t)))),
        e('div',{style:{marginTop:12,fontSize:12,color:C.sunriseBlue,fontWeight:600}},'View full plan →'))),
    e('div',{style:{borderRadius:20,overflow:'hidden',position:'relative',height:180,background:C.lightGray,marginTop:6}},
      e('div',{style:{position:'absolute',inset:0,background:'linear-gradient(135deg,#FBDEF3 0%,#ABD4FF 100%)',opacity:0.7}}),
      e('div',{style:{position:'absolute',bottom:16,left:16}},
        e('div',{style:{fontSize:20,fontWeight:700,color:C.charcoal,lineHeight:1.3}},'Your Healthy',e('br'),'Weight Journey'),
        e('div',{style:{marginTop:8,background:C.afternoonGreen,borderRadius:20,padding:'4px 12px',display:'inline-block'}},
          e('span',{style:{fontSize:11,fontWeight:600,color:C.charcoal}},'Available'))),
      e('div',{style:{position:'absolute',bottom:16,right:16,width:36,height:36,borderRadius:'50%',background:C.charcoal,display:'flex',alignItems:'center',justifyContent:'center'}},
        e('svg',{width:14,height:14,viewBox:'0 0 24 24',fill:C.cream},e('polygon',{points:'5 3 19 12 5 21 5 3'})))));

const IntroScreen = ({onStart}) =>
  e('div',{style:{minHeight:'100vh',display:'flex',flexDirection:'column',justifyContent:'center',padding:'2rem 1.5rem',background:C.cream}},
    e('div',{style:{marginBottom:32}},
      e('div',{style:{fontSize:11,fontWeight:600,color:C.gray,letterSpacing:'0.1em',textTransform:'uppercase',marginBottom:12}},'Demo persona'),
      e('div',{style:{fontSize:28,fontWeight:700,color:C.charcoal,marginBottom:4}},'Angie'),
      e('div',{style:{fontSize:14,color:C.gray,marginBottom:28}},'44 years old — Atlanta, Georgia'),
      e('div',{style:{display:'flex',flexDirection:'column',gap:12}},
        [{label:'Joined',value:'9amHealth in February 2026'},
         {label:'Medication',value:'GLP-1 — continued from prior provider'},
         {label:'Progress',value:'20 lbs lost since starting'},
         {label:'Struggle',value:'Consistent exercise and building long-term healthy habits'},
         {label:'App behavior',value:'Transactional — does what\'s needed to keep her prescription, but doesn\'t engage beyond that'},
        ].map(({label,value})=>
          e('div',{key:label,style:{display:'flex',gap:12,alignItems:'flex-start'}},
            e('div',{style:{fontSize:12,fontWeight:600,color:C.gray,minWidth:110,paddingTop:1,flexShrink:0}},label),
            e('div',{style:{fontSize:14,color:C.charcoal,lineHeight:1.5}},value))))),
    e('div',{style:{borderTop:`1px solid ${C.lightGray}`,paddingTop:24,marginBottom:28}},
      e('div',{style:{fontSize:12,fontWeight:600,color:C.gray,letterSpacing:'0.08em',textTransform:'uppercase',marginBottom:10}},'What this prototype shows'),
      e('div',{style:{display:'flex',flexDirection:'column',gap:8}},
        ['Sophie surfaces a WOOP habit-building session organically',
         'Angie builds a personalized plan with AI-generated nudges',
         'Sophie follows up 48 hours later and evolves the plan',
         'The plan lives on Angie\'s home screen as a persistent artifact',
         'Sophie draws on Angie\'s care history to make it feel personal',
        ].map((item,i)=>
          e('div',{key:i,style:{display:'flex',gap:10,alignItems:'flex-start'}},
            e('div',{style:{width:18,height:18,borderRadius:'50%',background:C.afternoonGreen,display:'flex',alignItems:'center',justifyContent:'center',flexShrink:0,marginTop:1}},
              e('svg',{width:10,height:10,viewBox:'0 0 12 12'},
                e('polyline',{points:'2 6 5 9 10 3',fill:'none',stroke:C.charcoal,strokeWidth:1.5,strokeLinecap:'round',strokeLinejoin:'round'}))),
            e('div',{style:{fontSize:13,color:C.charcoal80,lineHeight:1.5}},item))))),
    e('button',{className:'cta',onClick:onStart,style:{background:C.charcoal,border:'none',borderRadius:24,padding:'14px 24px',color:C.cream,fontSize:14,fontWeight:600,width:'100%'}},'Start demo →'));

function App() {
  const [phase, setPhase] = useState('intro');
  const [nav, setNav] = useState('chat');
  const [woopMsgs, setWoopMsgs] = useState([]);
  const [checkinMsgs, setCheckinMsgs] = useState([]);
  const [typing, setTyping] = useState(false);
  const [woopStep, setWoopStep] = useState(0);
  const [checkinStep, setCheckinStep] = useState(0);
  const [inputVal, setInputVal] = useState('');
  const [data, setData] = useState({wish:'',outcome:'',obstacle:'',plan:''});
  const [woopDone, setWoopDone] = useState(false);
  const bottomRef = useRef(null);

  const addTo = (setter,msg) => setter(m=>[...m,{...msg,id:Date.now()+Math.random()}]);
  const lockLastOf = (setter) => setter(m=>m.map((msg,i)=>i===m.length-1?{...msg,options:null,input:null}:msg));
  const curSetter = () => phase==='woop'?setWoopMsgs:setCheckinMsgs;
  const addSophie = (msg) => addTo(curSetter(),{from:'sophie',...msg});
  const addUser = (text) => addTo(curSetter(),{from:'user',text});
  const lockLast = () => lockLastOf(curSetter());
  const withTyping = (fn,delay=1300) => { setTyping(true); setTimeout(()=>{setTyping(false);fn();},delay); };

  const handleNav = (id) => {
    setNav(id);
    if(id==='home') setPhase('home');
    else if(id==='chat'&&phase==='home') setPhase(woopDone?'checkin':'woop');
  };

  useEffect(()=>{
    if(phase==='woop'&&woopMsgs.length===0){
      withTyping(()=>{
        setWoopMsgs([{from:'sophie',id:1,
          text:"Hi Angie! I'm Sophie, your 9amHealth coach. You've been doing really well -- 20 lbs down since you started is something to be proud of.\n\nI want to make sure you feel supported beyond just the medication. Can I walk you through a quick 5-minute exercise that can help healthy habits actually stick long-term?",
          options:["Sure, I'm open to it","What kind of exercise?"]}]);
      },600);
    }
  },[phase]);

  useEffect(()=>{ bottomRef.current&&bottomRef.current.scrollIntoView({behavior:'smooth'}); },[woopMsgs,checkinMsgs,typing,phase]);

  const handleOption = (opt) => {
    lockLast(); addUser(opt);
    if(phase==='woop') handleWoopOption(opt);
    else handleCheckinOption(opt);
  };

  const handleWoopOption = (opt) => {
    const s=woopStep;
    if(s===0){
      withTyping(()=>{ addTo(setWoopMsgs,{from:'sophie',text:"It's called WOOP -- a method backed by behavioral science. We'll clarify what you want, why it matters, and most importantly, plan for the obstacles that usually get in the way.\n\nAt the end, I'll turn your plan into personalized nudges. Ready?",options:["Let's do it"]}); setWoopStep(1); });
    } else if(s===1){
      withTyping(()=>{ addTo(setWoopMsgs,{from:'sophie',text:"Think about your health beyond the medication -- your day-to-day lifestyle. What's one thing you wish felt easier or more natural?\n\nIt could be movement, sleep, eating, stress, energy levels... whatever feels most real right now.",input:true,placeholder:"e.g. I wish I could make exercise a consistent habit...",inputKey:'wish'}); setWoopStep(2); });
    } else if(s===4){
      withTyping(()=>{ addTo(setWoopMsgs,{from:'sophie',text:"That's a real commitment, Angie. Naming the obstacle is the hardest part -- most people skip it.\n\nI've saved your WOOP and set up your nudges. You'll find them on your dashboard anytime.",special:'woop',woopData:data}); setWoopDone(true); setWoopStep(5); });
    }
  };

  const handleWoopInput = (key) => {
    if(!inputVal.trim()) return;
    const val=inputVal.trim();
    lockLast(); addUser(val);
    const nd={...data,[key]:val};
    setData(nd); setInputVal('');
    if(key==='wish'){
      withTyping(()=>{ addTo(setWoopMsgs,{from:'sophie',text:"That's a really honest one -- and one of the most common things people on this journey want.\n\nNow imagine you actually made this happen. What would be the best outcome? How would you feel day-to-day, or what would be different about your life?",input:true,placeholder:"e.g. I'd have more energy, feel stronger, feel like I'm building something that lasts...",inputKey:'outcome'}); });
    } else if(key==='outcome'){
      withTyping(()=>{ addTo(setWoopMsgs,{from:'sophie',text:"That sounds worth building toward.\n\nHere's the important part -- most habits fall apart not because people don't want them, but because something gets in the way. What's the inner obstacle? Not your schedule or logistics, but a feeling or thought that makes it easy to skip.",input:true,placeholder:"e.g. After work I'm just exhausted and can't motivate myself...",inputKey:'obstacle'}); });
    } else if(key==='obstacle'){
      withTyping(()=>{ addTo(setWoopMsgs,{from:'sophie',text:"That's such a real one. And honestly, it tracks -- your coach mentioned that your schedule has been really demanding lately, especially with the project you've been managing at work.\n\nLow energy after a full day is one of the most common reasons exercise doesn't stick -- it's not a willpower problem.\n\nLet's make a plan for exactly that moment. Complete this:\n\n\"If I feel too tired to exercise after work, then I will...\"\n\nMake it specific and realistic -- something you could actually do even on a hard day.",input:true,placeholder:"e.g. I'll put on my shoes and do a 20-minute walk, even if that's all I do...",inputKey:'plan'}); });
    } else if(key==='plan'){
      setData(nd);
      withTyping(()=>{ addTo(setWoopMsgs,{from:'sophie',text:"You named low energy as your obstacle -- that takes real self-awareness. A lot of people just tell themselves they're lazy.\n\nI also know from your coach that you used to walk your dog in the evenings before things got busy. That might be your built-in plan right there.\n\nBefore I save this: does this feel like a commitment you can actually try this week?",options:["Yes, I'm committing to this","I want to adjust something"]}); setWoopStep(4); });
    }
  };

  const startCheckin = () => {
    setPhase('checkin'); setNav('chat');
    withTyping(()=>{
      setCheckinMsgs([{from:'sophie',id:Date.now(),
        text:"Hey Angie -- it's been a couple of days. I wanted to check in on your plan.\n\nYou committed to: if you feel too tired to exercise after work, you'd put on your shoes and do a 20-minute walk anyway. Your coach also mentioned you were hoping to be more active before your daughter's graduation in June -- so I've been thinking about you. How did it go?",
        options:["I struggled with it","It went pretty well","I forgot about it"]}]);
      setCheckinStep(0);
    },600);
  };

  const handleCheckinOption = (opt) => {
    const s=checkinStep;
    if(s===0){
      withTyping(()=>{ setCheckinMsgs(m=>[...m,{from:'sophie',id:Date.now(),text:"Thank you for being honest -- that's actually the most useful thing you can tell me.\n\nWhat got in the way? Was it the tiredness itself, or something else?",options:["I was exhausted and just couldn't","My schedule got unpredictable","I kept putting it off until it was too late","A mix of all of those"]}]); setCheckinStep(1); });
    } else if(s===1){
      withTyping(()=>{ setCheckinMsgs(m=>[...m,{from:'sophie',id:Date.now(),text:"That makes a lot of sense. An unpredictable schedule is one of the hardest obstacles to plan around -- because by the time the evening arrives, the window is already closed.\n\nYour original plan was built around reclaiming the evening. We need to add a backup for when the day gets away from you.\n\nWant to update your WOOP with that in mind?",options:["Yes, let's update it"]}]); setCheckinStep(2); });
    } else if(s===2){
      withTyping(()=>{ setCheckinMsgs(m=>[...m,{from:'sophie',id:Date.now(),text:"Here's what I'd add to your obstacle: \"...and the unpredictability of my schedule.\"\n\nAnd a backup plan: \"If my evening gets derailed, I'll do a 10-minute walk at lunch instead -- that counts.\"\n\nI'll also add a midday nudge at noon so you have an earlier option before the day takes over.",options:["That feels right, update my plan"]}]); setCheckinStep(3); });
    } else if(s===3){
      withTyping(()=>{ setCheckinMsgs(m=>[...m,{from:'sophie',id:Date.now(),text:"Done -- your plan is updated.\n\nThe fact that you tried, noticed what got in the way, and came back to refine it? That's exactly how habits form. It's never one clean attempt.\n\nTap home to see your updated plan on your dashboard.",special:'updatedWoop',woopData:data}]); setCheckinStep(4); });
    }
  };

  const renderMsg = (msg,i,allMsgs) => {
    const isLast=i===allMsgs.length-1;
    const showInteractive=isLast&&(msg.options||msg.input);
    if(msg.from==='user') return e('div',{key:msg.id||i,className:'msg-in',style:{display:'flex',gap:8,alignItems:'flex-start',flexDirection:'row-reverse'}},
      e(UserAvatar),
      e('div',{style:{maxWidth:'78%',background:C.midMorningBlue,color:C.charcoal,borderRadius:'14px 3px 14px 14px',padding:'10px 14px',fontSize:14,lineHeight:1.6,whiteSpace:'pre-line'}},msg.text));

    return e('div',{key:msg.id||i,className:'msg-in',style:{display:'flex',gap:8,alignItems:'flex-start'}},
      e(SophieAvatar),
      e('div',{style:{maxWidth:'82%'}},
        msg.special
          ? e(React.Fragment,null,
              e('div',{style:{background:C.fog,borderRadius:'3px 14px 14px 14px',padding:'10px 14px',fontSize:14,lineHeight:1.6,color:C.charcoal,whiteSpace:'pre-line'}},msg.text),
              e(WoopCard,{wish:msg.woopData&&msg.woopData.wish||data.wish,outcome:msg.woopData&&msg.woopData.outcome||data.outcome,obstacle:msg.woopData&&msg.woopData.obstacle||data.obstacle,plan:msg.woopData&&msg.woopData.plan||data.plan,updated:msg.special==='updatedWoop'}),
              msg.special==='woop'&&isLast&&woopDone&&e('button',{className:'cta',onClick:startCheckin,style:{marginTop:14,background:C.charcoal,border:'none',borderRadius:24,padding:'11px 20px',color:C.cream,fontSize:13,fontWeight:600,width:'100%'}},'Skip to 48-hour check-in'))
          : e('div',{style:{background:C.fog,borderRadius:'3px 14px 14px 14px',padding:'10px 14px',fontSize:14,lineHeight:1.6,color:C.charcoal,whiteSpace:'pre-line'}},msg.text),
        showInteractive&&msg.options&&e('div',{style:{display:'flex',flexDirection:'column',gap:6,marginTop:8}},
          msg.options.map((opt,j)=>e('button',{key:j,className:'opt',onClick:()=>handleOption(opt),style:{background:C.cream,border:`1px solid ${C.lightGray}`,borderRadius:24,padding:'9px 16px',fontSize:13,color:C.charcoal,textAlign:'left',transition:'background 0.15s'}},opt))),
        showInteractive&&msg.input&&e('div',{style:{marginTop:8,display:'flex',gap:8}},
          e('textarea',{value:inputVal,onChange:ev=>setInputVal(ev.target.value),placeholder:msg.placeholder,rows:2,
            onKeyDown:ev=>{if(ev.key==='Enter'&&!ev.shiftKey){ev.preventDefault();handleWoopInput(msg.inputKey);}},
            style:{flex:1,borderRadius:12,border:`1px solid ${C.lightGray}`,padding:'9px 12px',fontSize:13,lineHeight:1.5,resize:'none',background:C.cream,color:C.charcoal}}),
          e('button',{className:'cta',onClick:()=>handleWoopInput(msg.inputKey),style:{background:C.charcoal,border:'none',borderRadius:12,padding:'9px 16px',color:C.cream,fontSize:13,fontWeight:600,alignSelf:'stretch'}},'Send'))));
  };

  const showChat=phase==='woop'||phase==='checkin';

  return e('div',{style:{maxWidth:420,margin:'0 auto',background:C.cream,minHeight:'100vh',position:'relative'}},
    e('div',{style:{padding:'1rem 1rem 5rem'}},
      phase==='intro'&&e(IntroScreen,{onStart:()=>{setPhase('woop');setNav('chat');}}),
      phase==='home'&&e(HomeScreen,{data}),
      showChat&&e(React.Fragment,null,
        e('div',{style:{display:'flex',alignItems:'center',gap:10,marginBottom:16,paddingBottom:14,borderBottom:`1px solid ${C.lightGray}`}},
          e('div',{style:{width:38,height:38,borderRadius:'50%',background:`linear-gradient(135deg,${C.sunrisePink},${C.sunriseBlue})`,display:'flex',alignItems:'center',justifyContent:'center',flexShrink:0}},
            e('span',{style:{color:C.charcoal,fontSize:13,fontWeight:600}},'S')),
          e('div',null,
            e('div',{style:{fontSize:15,fontWeight:600,color:C.charcoal}},'Sophie'),
            e('div',{style:{fontSize:12,color:C.gray}},phase==='checkin'?'48-hour check-in':'Your 9amHealth coach')),
          e('div',{style:{marginLeft:'auto'}},
            phase==='woop'&&woopDone&&e('span',{style:{fontSize:11,background:C.afternoonGreen,color:C.charcoal,borderRadius:20,padding:'3px 10px',fontWeight:600}},'Plan saved'),
            phase==='checkin'&&e('span',{style:{fontSize:11,background:C.midMorningPink,color:C.charcoal,borderRadius:20,padding:'3px 10px',fontWeight:600}},'Day 3'))),
        e('div',{style:{display:'flex',flexDirection:'column',gap:14}},
          (phase==='woop'?woopMsgs:checkinMsgs).map((msg,i,arr)=>renderMsg(msg,i,arr)),
          typing&&e('div',{style:{display:'flex',gap:8,alignItems:'flex-start'}},
            e(SophieAvatar),
            e('div',{style:{background:C.fog,borderRadius:'3px 14px 14px 14px'}},e(TypingIndicator))),
          e('div',{ref:bottomRef})))),
    phase!=='intro'&&e(NavBar,{active:nav,onNav:handleNav}));
}

ReactDOM.createRoot(document.getElementById('root')).render(e(App));
</script>
</body>
</html>
